name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: git archive --format=zip -o "GuildGrudge-${GITHUB_REF_NAME}-forever.zip" HEAD GuildGrudge

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "GuildGrudge-${GITHUB_REF_NAME}-forever.zip" --title "$GITHUB_REF_NAME" --generate-notes
